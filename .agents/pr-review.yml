# .agents/pr-review.yml — PR reviewer config for GoRex.
# Same shape as the other code-repo consumers of Performant-Labs/playbook's pr-reviewer.

project:
  name: "GoRex"
  timezone: "America/Los_Angeles"

# CI review via PR-Agent through the Claude Code CLI, on the org secret CLAUDE_CODE_OAUTH_TOKEN
# shared with this repo; glm-5.3 on the z.ai GLM Coding Plan (ZAI_API_KEY; was DeepSeek) when the token is absent. This fork is
# public and cannot call the playbook's private reusable workflow, so .github/workflows/pr-review.yml
# sets the models itself and the model keys below only record them. The reviewer instructions
# live in .pr_agent.toml.
pr_agent:
  claude_model: "claude-opus-5-5"
  model: "openai/glm-5.3"   # API path when the Claude token is absent; was deepseek/deepseek-v4-pro
  skip_docs_only: true
  score_labels: true
  score_banner: true
  status_check: true

local_review:
  enabled: false

dual_review:
  enabled: false

dco:
  required: false

pr_template:
  enabled: false

test_tiers:
  t1_headless: true
  t2_aria: false
  t2_5_authenticated: false
  t3_visual: false
