<line x1="644" y1="327" x2="502" y2="327" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="502" cy="327" r="3" fill="#c2410c"/>
<circle cx="644" cy="327" r="11" fill="#c2410c"/>
<text x="644" y="331.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<line x1="644" y1="397" x2="412" y2="397" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="412" cy="397" r="3" fill="#c2410c"/>
<circle cx="644" cy="397" r="11" fill="#c2410c"/>
<text x="644" y="401.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<line x1="644" y1="431" x2="600" y2="431" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="600" cy="431" r="3" fill="#c2410c"/>
<circle cx="644" cy="431" r="11" fill="#c2410c"/>
<text x="644" y="435.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="830" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1f" font-weight="700" text-anchor="start">Notes</text>
<circle cx="841" cy="142" r="11" fill="#c2410c"/>
<text x="841" y="146.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="860" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Name, focused, pre-filled “New Profile”</text>
<text x="860" y="163" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Return = Create, Esc = Cancel.</text>
<text x="860" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Duplicate name → inline error, Create disabled.</text>
<circle cx="841" cy="207" r="11" fill="#c2410c"/>
<text x="841" y="211.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="860" y="211" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Two starting points</text>
<text x="860" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Inherit is the default choice; “copy” names</text>
<text x="860" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">the profile it copies (the selected one).</text>
<text x="860" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">One level only: profiles inherit from</text>
<text x="860" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Default, never from each other.</text>
<circle cx="841" cy="306" r="11" fill="#c2410c"/>
<text x="841" y="310.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="860" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Optional: try it right away</text>
<text x="860" y="327" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Profiles belong to panes, so this opens</text>
<text x="860" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">one that uses it.</text>
<circle cx="841" cy="371" r="11" fill="#c2410c"/>
<text x="841" y="375.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="860" y="375" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">The only modal step in Settings</text>
<text x="860" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Everything else saves as you change it.</text>
</svg>
