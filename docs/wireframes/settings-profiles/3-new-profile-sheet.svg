<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640">
<rect x="0" y="0" width="1240" height="640" rx="0" fill="#fafafa"/>
<text x="32" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1d1d1f" font-weight="700" text-anchor="start">3 · New Profile sheet</text>
<text x="32" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#636366" font-weight="400" text-anchor="start">From “+ New Profile…”, ⋯ ▸ Duplicate… (copy pre-selected), or the palette's “New Profile…”.</text>
<rect x="34" y="96" width="760" height="520" rx="12" fill="#00000014"/>
