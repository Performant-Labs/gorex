<circle cx="92" cy="110" r="6" fill="#28c840"/>
<text x="412.0" y="115" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="600" text-anchor="middle">Settings</text>
<line x1="32" y1="130" x2="792" y2="130" stroke="#c7c7cc" stroke-width="1"/>
