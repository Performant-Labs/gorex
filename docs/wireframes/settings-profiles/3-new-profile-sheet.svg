<text x="48" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8e8e93" font-weight="700" text-anchor="start">PROFILES</text>
<text x="52" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Default</text>
<text x="109.80000000000001" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8e8e93" font-weight="400" text-anchor="start">built-in</text>
<text x="216" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8e8e93" font-weight="400" text-anchor="end">3</text>
<rect x="40" y="252" width="186" height="30" rx="6" fill="#e4e4e8"/>
<text x="52" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="600" text-anchor="start">Presenting</text>
<text x="216" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8e8e93" font-weight="400" text-anchor="end">2</text>
<line x1="33" y1="568" x2="233" y2="568" stroke="#c7c7cc" stroke-width="1"/>
<text x="48" y="595" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2f6fde" font-weight="500" text-anchor="start">+  New Profile…</text>
<rect x="33" y="131" width="758" height="480" rx="0" fill="#00000022"/>
<rect x="204" y="135" width="420" height="330" rx="10" fill="#0000001f"/>
<rect x="202" y="131" width="420" height="330" rx="10" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
<text x="226" y="167" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="700" text-anchor="start">New Profile</text>
<text x="226" y="199" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Name</text>
<rect x="226" y="207" width="372" height="30" rx="6" fill="#ffffff" stroke="#2f6fde" stroke-width="2"/>
<text x="236" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Late night</text>
<text x="226" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8e8e93" font-weight="400" text-anchor="start">Must be unique and not empty.</text>
<text x="226" y="283" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Start from</text>
<circle cx="234" cy="303" r="7" fill="#ffffff" stroke="#2f6fde" stroke-width="5"/>
<text x="250" y="307" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Default — follow it for everything</text>
<text x="250" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#636366" font-weight="400" text-anchor="start">Later changes to Default flow through.</text>
<circle cx="234" cy="349" r="7" fill="#ffffff" stroke="#c7c7cc" stroke-width="1.5"/>
<text x="250" y="353" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">A copy of “Presenting”</text>
<text x="250" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#636366" font-weight="400" text-anchor="start">Starts with its overrides (text size 18 pt).</text>
<rect x="226" y="389" width="14" height="14" rx="3" fill="#2f6fde"/>
<text x="233" y="401" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">✓</text>
<text x="248" y="401" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Open a new tab with it</text>
<rect x="422" y="417" width="84" height="28" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
<text x="464.0" y="435.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="500" text-anchor="middle">Cancel</text>
<rect x="516" y="417" width="84" height="28" rx="6" fill="#2f6fde"/>
<text x="558.0" y="435.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="500" text-anchor="middle">Create</text>
<line x1="644" y1="223" x2="598" y2="223" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="598" cy="223" r="3" fill="#c2410c"/>
<circle cx="644" cy="223" r="11" fill="#c2410c"/>
