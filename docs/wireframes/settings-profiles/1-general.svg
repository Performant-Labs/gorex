<text x="532" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="400" text-anchor="middle">Dark</text>
<text x="258" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8e8e93" font-weight="400" text-anchor="start" font-style="italic">Later: notifications, confirm before quitting, … — app behaviour, not terminals.</text>
<text x="258" y="594" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8e8e93" font-weight="400" text-anchor="start" font-style="italic">Changes apply and save as you make them.</text>
