<text x="48" y="595" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2f6fde" font-weight="500" text-anchor="start">+  New Profile…</text>
<text x="258" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1d1d1f" font-weight="700" text-anchor="start">General</text>
<text x="258" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">These apply to the whole app, whatever profile a pane uses.</text>
