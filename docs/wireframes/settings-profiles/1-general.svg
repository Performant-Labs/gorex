<rect x="370" y="246" width="100" height="64" rx="8" fill="#f2f2f4" stroke="#c7c7cc" stroke-width="1"/>
<rect x="380" y="256" width="80" height="44" rx="4" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
<text x="420" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="400" text-anchor="middle">Light</text>
