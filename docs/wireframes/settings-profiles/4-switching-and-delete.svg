<text x="244" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8e8e93" font-weight="400" text-anchor="end">⌘−</text>
<text x="50" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Actual Size</text>
<text x="244" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8e8e93" font-weight="400" text-anchor="end">⌘0</text>
<text x="50" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Appearance</text>
<text x="244" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8e8e93" font-weight="400" text-anchor="end">▸</text>
<rect x="38" y="233" width="218" height="24" rx="4" fill="#2f6fde"/>
<text x="50" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="400" text-anchor="start">Profile</text>
<text x="244" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="400" text-anchor="end">▸</text>
<rect x="258" y="230" width="210" height="132" rx="8" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
<text x="272" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">✓</text>
<text x="292" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Default</text>
<text x="272" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start"></text>
<text x="292" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Presenting</text>
<text x="272" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start"></text>
<text x="292" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Late night</text>
<line x1="266" y1="322" x2="460" y2="322" stroke="#c7c7cc" stroke-width="1"/>
<text x="292" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">New Profile…</text>
<line x1="492" y1="270" x2="470" y2="270" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="470" cy="270" r="3" fill="#c2410c"/>
<circle cx="492" cy="270" r="11" fill="#c2410c"/>
<text x="492" y="274.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<rect x="32" y="400" width="440" height="200" rx="10" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
<text x="48" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="400" text-anchor="start">profile</text>
<line x1="32" y1="444" x2="472" y2="444" stroke="#c7c7cc" stroke-width="1"/>
<text x="52" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Profile: Default</text>
<text x="456" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8e8e93" font-weight="400" text-anchor="end">active</text>
<rect x="40" y="479" width="424" height="24" rx="5" fill="#e4e4e8"/>
<text x="52" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Profile: Presenting</text>
<text x="52" y="522" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Profile: Late night</text>
<text x="52" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Profile: New…</text>
<text x="52" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Settings…</text>
<text x="456" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8e8e93" font-weight="400" text-anchor="end">⌘,</text>
<line x1="492" y1="496" x2="472" y2="496" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="472" cy="496" r="3" fill="#c2410c"/>
<circle cx="492" cy="496" r="11" fill="#c2410c"/>
<text x="492" y="500.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<rect x="560" y="110" width="330" height="180" rx="12" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
<text x="584" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="700" text-anchor="start">Delete “Late night”?</text>
<text x="584" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Its overrides are lost. If it is the active</text>
<text x="584" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">profile, GoRex switches to Default.</text>
<text x="584" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">This cannot be undone.</text>
<rect x="690" y="240" width="84" height="28" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
<text x="732.0" y="258.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="500" text-anchor="middle">Cancel</text>
<rect x="784" y="240" width="84" height="28" rx="6" fill="#d70015"/>
<text x="826" y="258.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="500" text-anchor="middle">Delete</text>
<line x1="910" y1="190" x2="890" y2="190" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="890" cy="190" r="3" fill="#c2410c"/>
<circle cx="910" cy="190" r="11" fill="#c2410c"/>
<text x="910" y="194.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="930" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1f" font-weight="700" text-anchor="start">Notes</text>
<circle cx="941" cy="142" r="11" fill="#c2410c"/>
<text x="941" y="146.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="960" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">View ▸ Profile submenu</text>
<text x="960" y="163" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Radio list; rebuilt whenever profiles</text>
<text x="960" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">change (the menu is built once today).</text>
<circle cx="941" cy="207" r="11" fill="#c2410c"/>
<text x="941" y="211.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="960" y="211" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Palette entries</text>
<text x="960" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">One per profile, the active one marked,</text>
<text x="960" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">plus “Profile: New…” and “Settings…”.</text>
<circle cx="941" cy="272" r="11" fill="#c2410c"/>
<text x="941" y="276.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="960" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Delete always confirms</text>
<text x="960" y="293" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Auto-save means no Cancel later. If it</text>
<text x="960" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">was active, say where GoRex falls back.</text>
<text x="960" y="327" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#636366" font-weight="400" text-anchor="start">Shown over the Settings window.</text>
</svg>
