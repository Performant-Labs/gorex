<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640">
<rect x="0" y="0" width="1240" height="640" rx="0" fill="#fafafa"/>
<text x="32" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1d1d1f" font-weight="700" text-anchor="start">4 · Switching profiles outside Settings, and deleting one</text>
<text x="32" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#636366" font-weight="400" text-anchor="start">View ▸ Profile, the command palette, and the delete confirmation.</text>
<rect x="32" y="92" width="360" height="26" rx="4" fill="#f2f2f4" stroke="#c7c7cc" stroke-width="1"/>
<text x="48" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">GoRex</text>
<text x="104" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Shell</text>
<text x="160" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Edit</text>
<text x="216" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="600" text-anchor="start">View</text>
<text x="272" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Tabs</text>
<text x="328" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" font-weight="400" text-anchor="start">Window</text>
<rect x="32" y="120" width="230" height="146" rx="8" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
