name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # The race detector needs cgo, which GoRex does not use; on Windows the
      # tests run without it, so the Windows-only tests (Settings' own keys)
      # run there.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -count=1 -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: |
          go test -count=1 -v -run TestSettingsKeysOnWindows .
          go test -count=1 ./...
